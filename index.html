<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Expedientes de financiación</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="auth-out">
<header class="top">
  <div class="top-in">
    <button class="brand" id="homeBtn" type="button"><b>Expedientes</b><small>hipotecas y préstamos</small></button>
    <nav class="tabs" aria-label="Secciones">
      <button type="button" id="tabBoard" aria-current="page">Expedientes</button>
      <button type="button" id="tabAgenda" aria-current="false">Agenda <span class="badge num" id="agendaCount" hidden></span></button>
    </nav>
    <input class="search" id="search" type="search" placeholder="Buscar titular, municipio o referencia" aria-label="Buscar expedientes">
    <button class="btn small drive-btn" id="driveBtn" type="button" hidden>Conectar Google Drive</button>
    <span class="userbox" id="userBox"></span>
    <button class="btn primary" id="newBtn" type="button">Nuevo expediente</button>
  </div>
</header>

<main class="wrap" id="app"><p class="hint" style="padding:40px 0;text-align:center">Cargando…</p></main>

<dialog id="dlg"><div class="dlg" id="dlgIn"></div></dialog>
<input type="file" id="picker" accept="application/pdf,.pdf" multiple class="hidden">
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
